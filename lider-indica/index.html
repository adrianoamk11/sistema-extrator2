<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#137c49"/><meta name="description" content="Protótipo do Líder Indica: indicações, boxes e carteira pré-paga simulada."/>
<link rel="manifest" href="./manifest.webmanifest"/><title>Líder Indica | Demonstração</title>
<style>
:root{--g:#137c49;--gd:#095832;--bg:#f5f8f6;--line:#e4ebe5;--muted:#617269;--ink:#172d22;--gold:#e9b949}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:var(--g)}.shell{display:flex;min-height:100vh}.sidebar{background:var(--gd);color:white;width:242px;padding:25px 17px;flex-shrink:0}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;margin:0 7px 4px}.brand small{display:block;font-weight:500;font-size:12px;letter-spacing:1px;opacity:.8}.sidebtn{width:100%;padding:12px 15px;text-align:left;border-radius:11px;color:#e8f8ec;background:transparent;margin-top:7px}.sidebtn.active,.sidebtn:hover{background:#27875b}.main{width:100%;padding:30px clamp(16px,4vw,48px);max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:23px}.top h1{margin:0;font-size:27px}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{padding:6px 10px;border-radius:50px;background:#e7f5ed;color:#137c49;font-size:12px;font-weight:750}.warning{background:#fff5d9;color:#8b680f}.danger{background:#ffebea;color:#a33c31}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:15px}.card{background:white;border:1px solid var(--line);padding:19px;border-radius:16px;box-shadow:0 3px 12px #1b402009}.card h3{margin:0 0 12px;font-size:14px}.metric{font-size:27px;font-weight:800;letter-spacing:-.6px;margin:7px 0}.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{background:var(--g);border-radius:10px;color:white;padding:11px 15px;font-weight:700}.btn:hover{background:var(--gd)}.btn.secondary{background:#eef4ef;color:var(--gd)}.btn.outline{background:white;color:var(--g);border:1px solid var(--g)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field select{padding:11px;border:1px solid #d4ded7;border-radius:10px;background:white;min-width:0;width:100%}.field input:focus{outline:2px solid #90cdb0}.tablewrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}.tbl th{text-align:left;color:var(--muted);font-weight:600;background:#f8faf8}.tbl td,.tbl th{padding:12px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border-bottom:0}.status{font-weight:750;color:#167947}.status.wait{color:#a37a19}.status.paid{color:#287d4a}.footer{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.5}.notice{border:1px solid #efd99b;background:#fff9e9;padding:12px 15px;border-radius:12px;margin-bottom:18px;font-size:13px}.balance{background:linear-gradient(130deg,#126e43,#0a5932);color:white;border-radius:16px;padding:22px}.balance .metric{font-size:35px}.balance .muted{color:#cfe9d9}.phone{max-width:440px;margin:auto}.phonebar{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:0 -3px 18px;padding-bottom:13px;overflow-x:auto}.phonebar button{background:#f0f4f1;color:#335142;border-radius:30px;padding:9px 11px;white-space:nowrap}.phonebar button.active{background:#137c49;color:white}.bigcta{background:linear-gradient(120deg,#e7f5e7,#f7fce8);padding:18px;border-radius:14px;margin:14px 0}.link{word-break:break-all;background:#f3f7f4;padding:12px;border-radius:10px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:22px}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{padding:8px 14px;border-radius:9px;background:white;border:1px solid #dce7df}.seg button.active{background:var(--g);color:white}.full{width:100%}@media(max-width:850px){.sidebar{width:auto;padding:13px;position:sticky;top:0;z-index:3}.shell{display:block}.brand{font-size:20px}.sidenav{display:flex;overflow:auto}.sidebtn{white-space:nowrap;padding:10px;margin:4px 4px 0 0}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid{grid-template-columns:1fr}.top h1{font-size:23px}}@media(max-width:430px){.cards{gap:8px}.card{padding:14px}.metric{font-size:23px}.balance .metric{font-size:30px}}
</style></head><body><div id="app"></div>
<script>
const KEY='lider-indica-demo-v1';const base=()=>({credit:1000,indicators:[{id:'LI-0001',name:'João Silva',phone:'(11) 99999-1111',box:'Santana',pix:'',created:'10/11/2026'},{id:'LI-0002',name:'Maria Costa',phone:'(11) 99999-2222',box:'Jabaquara',pix:'',created:'10/11/2026'}],leads:[{id:1,name:'Carlos Almeida',phone:'(11) 90000-1000',city:'São Paulo',address:'',box:'Santana',ref:'LI-0001',status:'Aguardando contato',contract:'',date:'10/11/2026'},{id:2,name:'Pedro Martins',phone:'(11) 90000-2000',city:'São Paulo',address:'',box:'Santana',ref:'LI-0001',status:'Moto retirada',contract:'LOC-1025',date:'10/11/2026'},{id:3,name:'Ana Pereira',phone:'(11) 90000-3000',city:'São Paulo',address:'',box:'Jabaquara',ref:'LI-0002',status:'Em atendimento',contract:'',date:'10/11/2026'}],rewards:[{id:1,lead:2,ref:'LI-0001',value:100,status:'Aguardando aprovação',date:'10/11/2026'}],transactions:[]});let s;try{s=JSON.parse(localStorage.getItem(KEY))||base()}catch{s=base()}let page=new URLSearchParams(location.search).has('ref')?'form':'admin',tab='inicio',boxFilter='Todas',clientId='LI-0001';const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function money(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function link(id){return location.origin+location.pathname+'?ref='+encodeURIComponent(id)}function safeRef(){let ref=new URLSearchParams(location.search).get('ref');return s.indicators.find(i=>i.id===ref)}function btn(text,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+text+'</button>'}function info(){return '<div class="notice"><strong>DEMONSTRAÇÃO — SEM PAGAMENTOS REAIS.</strong> As informações são fictícias e ficam somente neste navegador. Links compartilhados não enviam cadastros para um servidor. Asaas e WhatsApp automático não estão conectados.</div>'}function nav(){return '<aside class="sidebar"><div class="brand">LÍDER <small>INDICA • PWA</small></div><nav class="sidenav">'+[['admin','Franqueadora'],['box','Painel do Box'],['client','App do indicador'],['form','Página do indicado']].map(([p,n])=>'<button class="sidebtn '+(page===p?'active':'')+'" onclick="go(\''+p+'\')">'+n+'</button>').join('')+'</nav></aside>'}function go(p){page=p;history.replaceState({},'',location.pathname);render()}function wrap(title,sub,content){$('app').innerHTML='<div class="shell">'+nav()+'<main class="main"><header class="top"><div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><span class="pill warning">Protótipo local</span></header>'+info()+content+'<div class="footer">Líder Indica · Protótipo de navegação e validação do fluxo. Não utilizar dados pessoais reais nem executar pagamentos com base nesta tela.</div></main></div>'}
function metrics(){const converted=s.leads.filter(l=>l.status==='Moto retirada').length,paid=s.rewards.filter(r=>r.status==='Pago').reduce((a,r)=>a+r.value,0),reserved=s.rewards.filter(r=>r.status!=='Pago').reduce((a,r)=>a+r.value,0);return {converted,paid,reserved,available:s.credit-paid-reserved}}
function admin(){let m=metrics(),rewards=s.rewards.map(r=>{let lead=s.leads.find(x=>x.id===r.lead),ind=s.indicators.find(x=>x.id===r.ref);return '<tr><td>'+esc(ind?.name)+'</td><td>'+esc(lead?.name)+'</td><td>'+money(r.value)+'</td><td class="status '+(r.status==='Pago'?'paid':'wait')+'">'+esc(r.status)+'</td><td>'+(r.status==='Aguardando aprovação'?btn('Aprovar Pix','approve('+r.id+')'):'—')+'</td></tr>'}).join('');let screen='<div class="cards">'+[['Saldo livre',money(m.available)],['Saldo alocado',money(s.credit)],['Premiações reservadas',money(m.reserved)],['Pix simulados pagos',money(m.paid)]].map(x=>'<div class="card"><div class="muted tiny">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="grid2"><section class="card"><h3>Carteira central da franqueadora</h3><div class="balance"><div class="muted">Disponível para novas premiações</div><div class="metric">'+money(m.available)+'</div><div class="tiny">Controle ilustrativo, sem conta Asaas vinculada</div></div><div class="actions">'+btn('Simular recarga de R$ 500','recharge()')+btn('Ver movimentações','showTx()','secondary')+'</div><p class="muted tiny">Após integrar uma conta exclusiva, cada recarga deverá ser confirmada pelo provedor antes de alterar o saldo.</p></section><section class="card"><h3>Resultados da campanha</h3><div class="metric">'+s.leads.length+' <span class="muted tiny">interessados cadastrados</span></div><div class="metric">'+m.converted+' <span class="muted tiny">retiradas confirmadas</span></div><div class="metric">'+s.indicators.length+' <span class="muted tiny">indicadores com link</span></div><p class="muted tiny">R$ 100 em Pix por retirada confirmada; R$ 100 de desconto para o novo locatário.</p></section></div><section class="card" style="margin-top:17px"><h3>Premiações para aprovação</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Indicador</th><th>Indicado</th><th>Valor</th><th>Situação</th><th>Ação</th></tr></thead><tbody>'+rewards+'</tbody></table></div></section><section class="card" style="margin-top:17px"><h3>Movimentações simuladas</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Tipo</th><th>Valor</th><th>Data</th></tr></thead><tbody>'+((s.transactions.length)?s.transactions.slice().reverse().map(t=>'<tr><td>'+esc(t.type)+'</td><td>'+money(t.value)+'</td><td>'+esc(t.date)+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">Nenhuma movimentação simulada até agora</td></tr>')+'</tbody></table></div></section>';wrap('Painel administrativo','Franqueadora · Carteira pré-paga única',screen)}
function recharge(){s.credit+=500;s.transactions.push({type:'Recarga de teste',value:500,date:new Date().toLocaleDateString('pt-BR')});save();render()}function approve(id){let r=s.rewards.find(x=>x.id===id),m=metrics();if(!r||r.status!=='Aguardando aprovação')return;if(s.credit-m.paid<r.value){alert('Saldo insuficiente.');return}if(!confirm('SIMULAR pagamento de R$ 100? Nenhum Pix real será enviado.'))return;r.status='Pago';r.date=new Date().toLocaleDateString('pt-BR');s.transactions.push({type:'Pix simulado para '+r.ref,value:-r.value,date:r.date});save();render()}function showTx(){document.querySelector('.card:last-of-type')?.scrollIntoView({behavior:'smooth'})}
function box(){let arr=s.leads.filter(x=>boxFilter==='Todas'||x.box===boxFilter);let rows=arr.map(l=>'<tr><td>'+esc(l.name)+'</td><td>'+esc(l.phone)+'</td><td>'+esc(l.box)+'</td><td>'+esc(l.ref)+'</td><td class="status">'+esc(l.status)+'</td><td>'+((l.status!=='Moto retirada')?btn('Atualizar','advance('+l.id+')','secondary'):'Concluída')+'</td></tr>').join('');wrap('Painel do Box','Leads recebidos, atendimento e retirada da moto','<div class="card"><div class="actions">'+btn('Novo locatário / Gerar link','newIndicator()')+'<select id="boxFilter" onchange="setBox(this.value)" style="padding:9px;border-radius:10px;border:1px solid #ddd">'+['Todas','Santana','Jabaquara'].map(v=>'<option '+(v===boxFilter?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div><section class="card" style="margin-top:16px"><h3>Indicações recebidas</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Nome</th><th>Telefone</th><th>Box</th><th>Código</th><th>Status</th><th>Ação</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><section class="card" style="margin-top:16px"><h3>Links dos locatários</h3>'+s.indicators.map(i=>'<div style="border-bottom:1px solid #eee;padding:12px 0"><strong>'+esc(i.name)+'</strong> · '+esc(i.box)+'<div class="muted tiny">'+esc(i.id)+'</div><div class="actions">'+btn('Copiar link','copyLink(\''+i.id+'\')','secondary')+btn('Compartilhar no WhatsApp','whatsapp(\''+i.id+'\')','outline')+'</div></div>').join('')+'</section>')}
function setBox(v){boxFilter=v;render()}function newIndicator(){let name=prompt('Nome do novo locatário (dados fictícios neste protótipo):');if(!name?.trim())return;let box=prompt('Box: Santana ou Jabaquara','Santana')||'Santana';let id='LI-'+String(Math.max(2,...s.indicators.map(i=>parseInt(i.id.split('-')[1])||0))+1).padStart(4,'0');s.indicators.push({id,name:name.trim(),phone:'',box,pix:'',created:new Date().toLocaleDateString('pt-BR')});save();render();copyLink(id)}function copyLink(id){navigator.clipboard?.writeText(link(id)).then(()=>alert('Link de demonstração copiado. Ainda não registra indicações entre dispositivos.')).catch(()=>prompt('Copie o link:',link(id)))}function whatsapp(id){window.open('https://wa.me/?text='+encodeURIComponent('Conheça a Líder! Ganhe R$ 100 de desconto ao alugar sua moto: '+link(id)),'_blank','noopener')}function advance(id){let l=s.leads.find(x=>x.id===id);if(!l)return;if(l.status==='Aguardando contato')l.status='Em atendimento';else if(l.status==='Em atendimento')l.status='Locação em andamento';else if(l.status==='Locação em andamento'){const c=prompt('Informe o número do contrato da retirada confirmada:');if(!c?.trim())return;l.contract=c.trim();l.status='Moto retirada';if(!s.rewards.some(r=>r.lead===l.id)){s.rewards.push({id:Math.max(0,...s.rewards.map(x=>x.id))+1,lead:l.id,ref:l.ref,value:100,status:'Aguardando aprovação',date:new Date().toLocaleDateString('pt-BR')})}let newId='LI-'+String(Math.max(2,...s.indicators.map(i=>parseInt(i.id.split('-')[1])||0))+1).padStart(4,'0');s.indicators.push({id:newId,name:l.name,phone:l.phone,box:l.box,pix:'',created:new Date().toLocaleDateString('pt-BR')});alert('Retirada confirmada! Prêmio de R$ 100 criado para aprovação. O novo locatário recebeu um link demonstrativo: '+newId)}save();render()}
function client(){let i=s.indicators.find(x=>x.id===clientId)||s.indicators[0],leads=s.leads.filter(l=>l.ref===i.id),reward=s.rewards.filter(r=>r.ref===i.id),paid=reward.filter(r=>r.status==='Pago').length;let list=leads.map(l=>'<div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:12px 0"><div><strong>'+esc(l.name.split(' ')[0])+' '+esc((l.name.split(' ')[1]||'').slice(0,1))+'.</strong><div class="muted tiny">'+esc(l.date)+'</div></div><span class="pill '+(l.status==='Moto retirada'?'':'warning')+'">'+esc(l.status)+'</span></div>').join('');let content='<div class="phone"><div class="field"><label>Visualizar indicador</label><select onchange="clientId=this.value;render()">'+s.indicators.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===clientId?'selected':'')+'>'+esc(x.name)+' ('+esc(x.id)+')</option>').join('')+'</select></div><div class="card"><div class="phonebar">'+[['inicio','Início'],['indicacoes','Indicações'],['premios','Meus Pix'],['perfil','Perfil']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>';if(tab==='inicio'){content+='<h2>Olá, '+esc(i.name.split(' ')[0])+'!</h2><div class="bigcta"><strong>Indique e ganhe R$ 100 via Pix</strong><p class="tiny">Seu amigo ganha R$ 100 de desconto. Seu prêmio é liberado quando ele retira a moto.</p></div><div class="grid"><div><div class="muted tiny">Indicações</div><div class="metric">'+leads.length+'</div></div><div><div class="muted tiny">Pix pagos</div><div class="metric">'+money(paid*100)+'</div></div></div><h3>Seu link exclusivo</h3><div class="link">'+esc(link(i.id))+'</div><div class="actions">'+btn('Copiar link','copyLink(\''+i.id+'\')')+btn('Enviar WhatsApp','whatsapp(\''+i.id+'\')','secondary')+'</div>'}else if(tab==='indicacoes'){content+='<h3>Minhas indicações ('+leads.length+')</h3>'+(list||'<div class="empty">Nenhuma indicação ainda.</div>')}else if(tab==='premios'){content+='<h3>Meus prêmios</h3><div class="metric">'+money(reward.length*100)+'</div><p class="muted">Total de prêmios conquistados na demonstração.</p>'+reward.map(r=>'<div style="padding:12px;border-bottom:1px solid #eee">R$ 100 · '+esc(r.status)+'</div>').join('')}else{content+='<h3>Meu perfil</h3><p>Nome: '+esc(i.name)+'</p><p>Box: '+esc(i.box)+'</p><p>Código: '+esc(i.id)+'</p><div class="field"><label>Chave Pix (apenas demonstrativa, não inserir dados reais)</label><input id="pixInput" placeholder="Não informar chave real" value="'+esc(i.pix||'')+'"/></div>'+btn('Salvar dado de teste','savePix()')};content+='</div></div>';wrap('Aplicativo do indicador','Instalável como PWA quando servido por HTTPS',content)}
function savePix(){let i=s.indicators.find(x=>x.id===clientId);i.pix=$('pixInput').value;save();alert('Dado de teste salvo apenas neste navegador.')}
function form(){let i=safeRef()||s.indicators[0];wrap('Indicação de locação','Página demonstrativa recebida pelo WhatsApp','<div class="phone"><div class="card"><div class="pill" style="display:inline-block">Benefício do indicado</div><h2>R$ 100 de desconto na locação</h2><p class="muted">Preencha seus dados para a equipe da Líder entrar em contato. Esta demonstração não envia o formulário para outras pessoas.</p><form onsubmit="submitLead(event)"><div class="field"><label>Nome completo</label><input name="name" required placeholder="Nome de teste"/></div><div class="field"><label>WhatsApp</label><input name="phone" required placeholder="(00) 00000-0000"/></div><div class="field"><label>Cidade</label><input name="city" required placeholder="Sua cidade"/></div><div class="field"><label>Endereço / bairro (opcional)</label><input name="address" placeholder="Bairro de teste"/></div><div class="field"><label>Unidade de interesse</label><select name="box"><option>Santana</option><option>Jabaquara</option></select></div><p class="muted tiny">Nesta demonstração, não informe dados pessoais reais. Uma versão de produção exigirá política de privacidade e fluxo de consentimento apropriados.</p><input type="hidden" name="ref" value="'+esc(i.id)+'"/><button class="btn full" type="submit">Registrar interesse de teste</button></form></div></div>')}
function submitLead(e){e.preventDefault();let d=new FormData(e.target),id=Math.max(0,...s.leads.map(x=>x.id))+1;s.leads.push({id,name:d.get('name'),phone:d.get('phone'),city:d.get('city'),address:d.get('address'),box:d.get('box'),ref:d.get('ref'),status:'Aguardando contato',contract:'',date:new Date().toLocaleDateString('pt-BR')});save();alert('Cadastro de teste salvo apenas neste navegador. Veja o Painel do Box.');go('box')}
function render(){if(page==='admin')admin();else if(page==='box')box();else if(page==='client')client();else form()}render();
</script></body></html>
