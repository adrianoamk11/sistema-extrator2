name: Validar tela de login (desenvolvimento)

on:
  push:
    branches: [desenvolvimento-chatgpt]
  workflow_dispatch:

jobs:
  teste-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dateutil pytest
      - name: Validar sintaxe
        run: python -m compileall -q app.py webhook.py
      - name: Testar tela de login sem usar credenciais reais
        run: python -m pytest -q tests/test_login.py
